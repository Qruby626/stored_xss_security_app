{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block page_title %}Error 500{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;">
  <div style="font-size:6rem;font-weight:800;
    background:linear-gradient(135deg,#ef4444,#f59e0b);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;margin-bottom:1rem;">500</div>

  <div style="font-size:1.2rem;font-weight:600;color:#E6EDF3;margin-bottom:.5rem;">Internal Server Error</div>
  <div style="font-size:.88rem;color:#8B949E;max-width:400px;line-height:1.6;margin-bottom:2rem;">
    Terjadi kesalahan pada server. Silakan coba lagi atau periksa log server untuk detail error.
  </div>

  <a href="{{ url_for('dashboard.index') }}" class="btn-primary-custom btn">
    <i class="bi bi-house me-2"></i>Kembali ke Dashboard
  </a>
</div>
{% endblock %}
