{% extends "base.html" %}
{% block title %}404 — Halaman Tidak Ditemukan{% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;">
  <div style="font-size:6rem;font-weight:800;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;margin-bottom:1rem;">404</div>

  <div style="font-size:1.2rem;font-weight:600;color:#E6EDF3;margin-bottom:.5rem;">Halaman Tidak Ditemukan</div>
  <div style="font-size:.88rem;color:#8B949E;max-width:380px;line-height:1.6;margin-bottom:2rem;">
    Halaman yang Anda cari tidak ada atau telah dipindahkan.
  </div>

  <div class="d-flex gap-3">
    <a href="{{ url_for('dashboard.index') }}" class="btn-primary-custom btn">
      <i class="bi bi-house me-2"></i>Kembali ke Dashboard
    </a>
    <a href="javascript:history.back()"
      style="display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.1rem;
        border:1px solid #30363d;border-radius:8px;color:#8b949e;text-decoration:none;font-size:.875rem;">
      <i class="bi bi-arrow-left"></i> Halaman Sebelumnya
    </a>
  </div>
</div>
{% endblock %}
